<!doctype html>
<!-- Throwaway: 在现有四列看板语境比较四种只读人工评审展示；?variant=A|B|C|D。全部为演示数据。 -->
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>人工评审 · UI 原型 v2</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#fff, #212121);
      --panel: light-dark(#f7f7f8, #29292c);
      --text: light-dark(#202020, #ececec);
      --muted: light-dark(#626262, #b4b4b4);
      --line: light-dark(#e2e3e8, #45454c);
      --blue: light-dark(#2563eb, #93c5fd);
      --purple: light-dark(#7c3aed, #c4b5fd);
      --amber: light-dark(#92400e, #fcd68b);
      --green: light-dark(#166534, #9de6b0);
      font:
        14px/1.6 'Segoe UI',
        'Microsoft YaHei',
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 22px 24px 96px;
    }
    button,
    a,
    summary {
      font: inherit;
    }
    button {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      color: var(--text);
      cursor: pointer;
    }
    button:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    button:hover {
      background: var(--panel);
    }
    a {
      color: var(--blue);
      text-underline-offset: 3px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    h3 {
      font-size: 13px;
      margin: 0 0 6px;
    }
    p {
      margin: 8px 0;
    }
    small,
    .muted {
      font-size: 12px;
      color: var(--muted);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header strong {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      color: var(--purple);
      font-size: 22px;
    }
    .notice {
      font-size: 12px;
      padding: 7px 12px;
      background: color-mix(in srgb, var(--amber) 8%, var(--bg));
      border-radius: 8px;
      color: var(--amber);
    }
    .scope {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    .scope span {
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
    }
    nav {
      display: flex;
      gap: 12px;
      margin: 14px 0;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }
    nav strong {
      border-radius: 8px;
      background: color-mix(in srgb, var(--blue) 8%, var(--bg));
      padding: 6px 12px;
      font-size: 13px;
    }
    nav span {
      padding: 6px 12px;
      font-size: 13px;
    }
    .context {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin: 12px 0 16px;
    }
    .context p {
      font-size: 12px;
      color: var(--muted);
    }
    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 18px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
      min-height: 430px;
    }
    .column {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px 9px;
    }
    .column:nth-child(2) {
      border-top-color: var(--blue);
    }
    .column:nth-child(3) {
      border-top-color: var(--amber);
    }
    .column:nth-child(4) {
      border-top-color: var(--green);
    }
    .column h2 {
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .count {
      color: var(--muted);
      font-size: 11px;
    }
    .task {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
    }
    .task.selected {
      border-color: var(--purple);
      box-shadow: 0 0 0 1px var(--purple);
    }
    .key {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .role {
      color: var(--purple);
    }
    .task strong {
      display: block;
      font-size: 13px;
      line-height: 1.5;
      margin: 9px 0;
    }
    .task p {
      font-size: 11px;
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      font-size: 11px;
      line-height: 1.6;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--panel);
      color: var(--muted);
    }
    .waiting {
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 9%, var(--bg));
    }
    .passed {
      color: var(--green);
      background: color-mix(in srgb, var(--green) 8%, var(--bg));
    }
    .empty {
      font-size: 11px;
      color: var(--muted);
      border: 1px dashed var(--line);
      padding: 16px 8px;
      text-align: center;
      border-radius: 8px;
    }
    .inspector {
      border-left: 1px solid var(--line);
      padding-left: 20px;
      min-width: 0;
    }
    .inspector h2 {
      font-size: 17px;
      margin-bottom: 6px;
    }
    .section {
      border-top: 1px solid var(--line);
      margin-top: 18px;
      padding-top: 14px;
    }
    .object {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      margin: 9px 0;
      position: relative;
    }
    .object-head {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }
    .object-head strong {
      font-size: 12px;
    }
    .version {
      font-size: 10px;
      color: var(--muted);
      background: var(--panel);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .object p {
      font-size: 11px;
      color: var(--muted);
    }
    .object small {
      font-size: 10px;
    }
    .callout {
      border-left: 3px solid var(--amber);
      padding: 9px 12px;
      background: color-mix(in srgb, var(--amber) 5%, var(--bg));
      margin: 12px 0;
    }
    .callout strong {
      font-size: 12px;
      color: var(--amber);
    }
    .callout p {
      font-size: 11px;
    }
    .timeline {
      list-style: none;
      padding: 0;
      font-size: 11px;
      color: var(--muted);
    }
    .timeline li {
      border-left: 2px solid var(--line);
      padding: 0 0 12px 12px;
    }
    .timeline strong {
      color: var(--text);
    }
    summary {
      cursor: pointer;
      font-size: 12px;
    }
    details p {
      font-size: 11px;
      color: var(--muted);
    }
    .banner {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      border: 1px solid color-mix(in srgb, var(--amber) 30%, var(--line));
      border-radius: 12px;
      background: color-mix(in srgb, var(--amber) 5%, var(--bg));
      padding: 14px 18px;
      margin-bottom: 16px;
    }
    .banner strong {
      font-size: 14px;
      color: var(--amber);
    }
    .banner p {
      font-size: 12px;
      color: var(--muted);
    }
    .banner a {
      white-space: nowrap;
      font-size: 12px;
    }
    .layout-b .content {
      grid-template-columns: minmax(0, 1fr) 300px;
    }
    .layout-b .object {
      padding: 9px;
    }
    .layout-c .content {
      grid-template-columns: minmax(0, 1fr) 330px;
    }
    .dependency {
      border-top: 1px solid var(--line);
      padding-top: 8px;
      margin-top: 8px;
      display: grid;
      gap: 5px;
      font-size: 10px;
    }
    .dependency span {
      display: flex;
      justify-content: space-between;
    }
    .dependency em {
      font-style: normal;
      color: var(--amber);
    }
    .tree {
      list-style: none;
      padding: 0;
      font-size: 12px;
    }
    .tree > li {
      margin: 14px 0;
      padding-left: 12px;
      border-left: 2px solid var(--line);
    }
    .tree p {
      font-size: 11px;
      color: var(--muted);
    }
    .legend {
      font-size: 11px;
      color: var(--muted);
      padding: 12px 0;
    }
    .switcher {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 12px;
      background: light-dark(#202020, #eee);
      color: light-dark(#fff, #202020);
      box-shadow: 0 4px 22px #0002;
      max-width: calc(100% - 24px);
      white-space: nowrap;
      font-size: 12px;
    }
    .switcher button {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 4px 8px;
    }
    .switcher a {
      color: inherit;
      font-size: 11px;
    }
    .state {
      font-size: 11px;
      color: var(--muted);
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    dialog {
      width: min(580px, calc(100% - 32px));
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    dialog::backdrop {
      background: #0005;
    }
    dialog p {
      font-size: 13px;
    }
    dialog button {
      float: right;
    }
    .inspector[hidden] {
      display: none;
    }
    .content:has(.inspector[hidden]) {
      grid-template-columns: 1fr;
    }
    @media (max-width: 1050px) {
      .board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .content {
        grid-template-columns: minmax(0, 1fr) 310px !important;
      }
      .column {
        min-height: 220px;
      }
    }
    @media (max-width: 700px) {
      body {
        padding: 16px 16px 100px;
      }
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .scope {
        flex-wrap: wrap;
      }
      .content {
        display: block !important;
      }
      .inspector {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 20px 0;
        margin-top: 18px;
      }
      .board {
        min-height: 0;
      }
      .banner {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
      .switcher {
        gap: 4px;
        white-space: normal;
        width: max-content;
      }
      .switcher a {
        display: none;
      }
      .context {
        align-items: flex-start;
        flex-direction: column;
        gap: 0;
      }
      .layout-b .board,
      .layout-c .board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
  <body>
    <header>
      <strong>
        <span class="logo" aria-hidden="true">✣</span>
        <h1>Agent Team</h1>
      </strong>
      <span class="notice">UI 原型 v2 · 演示数据 · 人工确认在原生对话中完成</span>
    </header>
    <div class="scope">
      <span>codex-agent-team · 本机</span>
      <span>主会话 · 人工评审流程优化</span>
    </div>
    <nav>
      <strong>▥ Kanban</strong>
      <span>♧ Agent Org Chart</span>
    </nav>
    <div class="context">
      <p id="description"></p>
      <small>只读展示 · 不改变原生任务</small>
    </div>
    <div id="variant"></div>
    <p class="state" id="state" role="status"></p>
    <div class="switcher" aria-label="仅原型使用的方案切换">
      <button id="prev" aria-label="上一个方案">←</button>
      <span id="variant-label"></span>
      <button id="next" aria-label="下一个方案">→</button>
      <a href="?variant=A">A</a>
      <a href="?variant=B">B</a>
      <a href="?variant=C">C</a>
      <a href="?variant=D">A+B</a>
    </div>
    <dialog id="document">
      <button id="close-document" aria-label="关闭演示产物">×</button>
      <h2 id="document-title"></h2>
      <span class="notice">演示产物摘要 · 不是真实批准依据</span>
      <p id="document-content"></p>
    </dialog>
    <script>
      // 全部假数据仅用于比较布局；不请求回报接口、不持久化、不提供批准操作。
      const objects = [
        {
          id: 'spec',
          name: '需求规格',
          version: 'v1',
          state: '已人工确认',
          tone: 'passed',
          note: '目标、范围与验收边界',
          evidence: '演示用户回复：“确认 Spec v1”',
          content: '演示：由协调者记录产物版本及用户明确确认，只允许相关依赖任务开始。',
        },
        {
          id: 'adr',
          name: '关键架构决策',
          version: '—',
          state: '本任务不适用',
          tone: '',
          note: '沿用原生协调者与只读展示',
          evidence: '未引入新的关键架构取舍',
          content: '演示：此任务不需要新增 ADR，因此它不会成为额外等待条件。',
        },
        {
          id: 'ui',
          name: '人工评审展示原型',
          version: 'v2',
          state: '待人工确认',
          tone: 'waiting',
          note: '从列表改为分组展示，需重新评审',
          evidence: '等待用户确认当前 v2；v1 仅保留历史',
          content: '演示：当前原型 v2 尚未确认。旧版 v1 已确认，但它不适用于新的视觉方向。',
        },
      ];
      const objectList = () =>
        objects
          .map(
            (o) =>
              `<div class="object"><div class="object-head"><strong>${o.name}</strong><span class="version">${o.version}</span><span class="pill ${o.tone}">${o.state}</span></div><p>${o.note}</p><a href="#${o.id}" data-preview="${o.id}">查看产物 ↗</a><p><small>${o.evidence}</small></p></div>`,
          )
          .join('');
      const history = () =>
        `<details class="section"><summary>历史评审 · 3 条</summary><ul class="timeline"><li><strong>人工 · UI v1 已确认</strong><br>仅适用于旧版视觉方案</li><li><strong>Agent · UI v2 审查通过</strong><br>质量检查通过，仍等待人工确认</li><li><strong>协调者 · 当前 UI 已更新至 v2</strong><br>视觉变化影响工单 01，重新提交人工评审</li></ul></details>`;
      const explanation = () =>
        `<div class="callout"><strong>等待你确认 UI 原型 v2</strong><p>Spec v1 已确认。当前 UI 版本未确认，工单 01 的正式界面实现继续等待；独立调研可继续。</p></div>`;
      function task(id, title, role, body, pill = '', extra = '') {
        return `<button class="task ${id === '01' ? 'selected' : ''}" data-task="${id}"><span class="key">HR-${id}<span class="role">${role}</span></span><strong>${title}</strong><p>${body}</p>${pill}${extra}</button>`;
      }
      function board(inline = false) {
        return `<div class="board"><section class="column"><h2>待开始 <span class="count">2</span></h2>${task('01', '贯通 Spec 确认与实施分派', 'Coordinator', '正式界面实现等待当前原型确认', '<span class="pill waiting">待人工评审 · UI v2</span>', inline ? '<div class="dependency"><span>Spec v1 <b>已确认</b></span><span>UI v2 <em>待确认</em></span><span>ADR <b>不适用</b></span></div>' : '')}${task('02', '按范围关联 ADR / UI 确认', 'Developer', '依赖工单 01 的确认闭环', '<span class="pill">依赖工单 01</span>')}</section><section class="column"><h2>进行中 <span class="count">1</span></h2>${task('R1', '核对历史回报兼容边界', 'Architect', '独立调研，可以在评审等待期间继续', '<span class="pill">独立探索</span>')}</section><section class="column"><h2>待评审 <span class="count">1</span></h2>${task('D1', '检查确认记录设计', 'Reviewer', 'Agent 审查，不代表人工认可', '<span class="pill">待 Agent 审查</span>')}</section><section class="column"><h2>执行完成 <span class="count">1</span></h2>${task('P1', '整理需求规格与验收边界', 'Requirements', '材料准备完成，最终产品交付尚未验收', '<span class="pill passed">材料完成</span>')}</section></div>`;
      }
      const title = () => '<h2>贯通 Spec 确认与实施分派</h2><small>HR-01 · Coordinator</small>';
      function VariantA() {
        return `<div class="content">${board()}<aside class="inspector" id="review">${title()}${explanation()}<div class="section"><h3>实施前人工评审</h3><small>仅针对当前产物版本 · 1 项待确认</small>${objectList()}</div><div class="section"><h3>影响任务</h3><p class="muted">HR-01 等待 UI v2；HR-02 依赖 HR-01。独立调研 HR-R1 继续。</p></div>${history()}</aside></div>`;
      }
      function VariantB() {
        return `<div class="banner"><div><strong>待你决定 · 1 项</strong><p>UI 原型 v2 尚未确认，影响 1 个直接实施任务。Spec v1 已确认。</p></div><a href="#review" data-open>查看本次评审对象 →</a></div><div class="content">${board()}<aside class="inspector" id="review">${title()}<div class="section"><h3>当前评审批次</h3>${objectList()}</div><div class="section"><h3>评审时间线</h3><ul class="timeline"><li><strong>待人工 · UI v2</strong><br>新版原型已提交，等待明确回复</li><li><strong>Agent · 当前版审查通过</strong><br>不放行人工确认依赖</li><li><strong>人工 · Spec v1 已确认</strong><br>仅确认规格，不涵盖 UI v2</li><li><strong>历史 · UI v1 已确认</strong><br>不适用于当前 v2</li></ul></div></aside></div>`;
      }
      function VariantC() {
        return `<div class="content">${board(true)}<aside class="inspector">${title()}<div class="section"><h3>当前实施依赖</h3><small>所有必需产物对应版本均满足后才开始</small><ul class="tree"><li><strong>Spec v1</strong> <span class="pill passed">已确认</span><p>人工明确回复，范围为需求规格。</p><a href="#spec" data-preview="spec">查看规格 ↗</a></li><li><strong>UI v2</strong> <span class="pill waiting">待确认</span><p>阻塞 HR-01；旧版 v1 确认保留在历史。</p><a href="#ui" data-preview="ui">查看原型 ↗</a></li><li><strong>ADR</strong> <span class="pill">不适用</span><p>没有新的关键架构取舍。</p></li></ul></div>${explanation()}${history()}<div class="section"><h3>当前阶段</h3><p class="muted">尚未开始正式实现 · 未人工验收交付</p></div></aside></div>`;
      }
      function VariantD() {
        return (
          `<div class="banner"><div><strong>待你决定 · 1 项人工评审</strong><p>UI 原型 v2 尚未确认，1 个直接实施任务等待；Spec v1 已确认，独立调研继续。</p></div><a href="#review" data-open>查看待确认产物 →</a></div>` +
          VariantA()
        );
      }
      const variants = ['A', 'B', 'C', 'D'],
        names = {
          A: '详情内评审清单（推荐）',
          B: '顶部待决定摘要',
          C: '卡片依赖与产物树',
          D: 'A + B · 顶部摘要与详情清单',
        };
      let current = variants.includes(new URL(location.href).searchParams.get('variant'))
        ? new URL(location.href).searchParams.get('variant')
        : 'D';
      function show(value) {
        current = value;
        document.body.className = 'layout-' + value.toLowerCase();
        document.getElementById('variant').innerHTML = {
          A: VariantA,
          B: VariantB,
          C: VariantC,
          D: VariantD,
        }[value]();
        document.getElementById('description').textContent = {
          A: '保留四列看板，点击任务在详情中查看需要人工确认的当前版本。',
          B: '会话层先汇总待决定内容，再通过右侧时间线查看确认依据。',
          C: '任务卡片直接展示确认依赖，右侧展开当前产物和历史。',
          D: 'A + B：顶部汇总待决定事项，详情集中当前版本清单，历史折叠保留。',
        }[value];
        document.getElementById('variant-label').textContent = value + ' · ' + names[value];
        document.getElementById('state').textContent =
          '演示状态：Spec v1 已人工确认；UI v2 待人工确认；ADR 不适用；UI v1 确认仅属历史。正式实现未开始，最终交付未验收。';
        const url = new URL(location.href);
        url.searchParams.set('variant', value);
        window.history.replaceState({}, '', url);
        bind();
      }
      function cycle(step) {
        show(variants[(variants.indexOf(current) + step + variants.length) % variants.length]);
      }
      function bind() {
        document.querySelectorAll('[data-preview]').forEach(
          (a) =>
            (a.onclick = (e) => {
              e.preventDefault();
              const o = objects.find((x) => x.id === a.dataset.preview);
              document.getElementById('document-title').textContent = o.name + ' ' + o.version;
              document.getElementById('document-content').textContent = o.content;
              document.getElementById('document').showModal();
            }),
        );
        document.querySelectorAll('[data-task]').forEach(
          (b) =>
            (b.onclick = () => {
              document
                .querySelectorAll('[data-task]')
                .forEach((x) => x.classList.toggle('selected', x === b));
              const aside = document.querySelector('.inspector');
              aside.hidden = false;
              if (b.dataset.task === '01') show(current);
              else
                aside.innerHTML =
                  '<h2>' +
                  b.querySelector('strong').textContent +
                  '</h2><p class="muted">' +
                  b.querySelector('p').textContent +
                  '</p><div class="section"><h3>演示说明</h3><p class="muted">这一任务没有独立人工确认请求。点击 HR-01 查看完整评审对象、版本与依赖。</p></div>';
            }),
        );
        document.querySelector('[data-open]')?.addEventListener('click', (e) => {
          e.preventDefault();
          show(current);
          document
            .querySelector('.inspector')
            .scrollIntoView({ block: 'start', behavior: 'smooth' });
        });
      }
      document.getElementById('prev').onclick = () => cycle(-1);
      document.getElementById('next').onclick = () => cycle(1);
      document.getElementById('close-document').onclick = () =>
        document.getElementById('document').close();
      document.addEventListener('keydown', (e) => {
        if (
          e.target.closest('input,textarea,select,[contenteditable]') ||
          document.getElementById('document').open
        )
          return;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault();
          cycle(e.key === 'ArrowLeft' ? -1 : 1);
        }
      });
      show(current);
    </script>
  </body>
</html>
