dding-top:8px}.node-label{display:flex;justify-content:space-between;gap:8px}.org-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.unlinked{margin-top:24px;border-top:1px solid var(--border);padding-top:16px}.unlinked-grid{display:flex;gap:12px;flex-wrap:wrap}

.embedded{padding:24px 24px 16px!important}header{padding-block:8px;min-height:52px;gap:16px}.session-picker{margin-top:12px}#layout{margin-top:4px}.filter-caption{font-size:12px;color:var(--muted);white-space:nowrap}.role-runs ul{list-style:none;padding:0;margin:12px 0}.role-runs li{display:grid;gap:5px;padding:12px 0;border-bottom:1px solid var(--border)}.role-runs li strong{font-size:13px}.task-history{margin-top:16px}.task-history summary{font-weight:600;color:var(--text)}.run-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.org-edge{vector-effect:non-scaling-stroke;stroke-width:1.2;opacity:.35}.org-edge.focused{stroke-width:1.6;opacity:.65}.org-flight.playing{stroke-width:2;stroke-dasharray:8 92;vector-effect:non-scaling-stroke;opacity:0;animation:org-comet 2.4s linear 3 forwards}.org-particle{fill:var(--text);pointer-events:none}.org-node.dimmed{opacity:.72}@keyframes org-comet{0%{stroke-dashoffset:0;opacity:0}12%,88%{opacity:.8}100%{stroke-dashoffset:-100;opacity:0}}@media(max-width:650px){.embedded{padding:20px 16px 12px!important}header{gap:8px}.toolbar{gap:8px}.picker-trigger{max-width:48vw}.filter-caption{width:100%}}
</style><!-- POLISH --></head><body>
<h1><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Agent Team</h1>
<header><div class="workspace" id="picker"><span class="workspace-label" id="workspace-label">Workspace</span><button id="workspace" class="picker-trigger" role="combobox" aria-label="选择 Workspace" aria-haspopup="listbox" aria-expanded="false" aria-controls="workspace-menu"><span id="workspace-value">加载中</span><svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="m4 6 4 4 4-4"/></svg></button><div id="workspace-menu" role="listbox" aria-label="Workspace 项目" hidden></div></div><details class="session-picker"><summary id="session-label">选择主会话</summary><div id="session-options" class="filters"></div></details><div class="toolbar"><span id="coverage" class="muted">正在加载</span></div></header>

<nav role="tablist" aria-label="团队视图"><button id="kanban" role="tab" aria-selected="true" aria-controls="content"><svg class="view-icon kanban-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="2"/><rect x="10" y="4" width="5" height="11" rx="2"/><rect x="17" y="4" width="4" height="14" rx="2"/></svg>Kanban</button><button id="org" role="tab" aria-selected="false" aria-controls="content"><svg class="view-icon org-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 8v6M5 17v-3h14v3"/><rect x="8" y="2" width="8" height="6" rx="2"/><rect x="2" y="17" width="6" height="5" rx="1.5"/><rect x="16" y="17" width="6" height="5" rx="1.5"/></svg>Agent Org Chart</button></nav>
<section id="review-banner" hidden aria-label="当前会话待人工评审"></section>
<section id="filters" class="filters" hidden aria-label="任务筛选"><input id="search" type="search" aria-label="搜索任务标题或编号" placeholder="搜索任务标题或编号"><span class="filter-caption">职责角色</span><div id="roles" role="group" aria-label="按职责角色筛选"></div><button id="clear-filters">清除筛选</button></section>
